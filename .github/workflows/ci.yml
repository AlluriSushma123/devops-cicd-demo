name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-cicd-demo .

      - name: Test Docker image
        run: docker run -d -p 5000:5000 --name test-container devops-cicd-demo

      - name: Check application
        run: |
          sleep 5
          curl http://localhost:5000

      - name: Stop container
        run: docker stop test-container
